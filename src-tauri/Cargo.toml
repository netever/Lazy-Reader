[package]
name = "lazy-reader"
version = "0.1.0"
description = "Cross-platform e-book reader"
authors = ["Vladimir"]
license = "UNLICENSED"
publish = false
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name different from the bin name (needed on Windows).
name = "lazy_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
# CLOCK_BOOTTIME for startup measurements (src/perf.rs)
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
